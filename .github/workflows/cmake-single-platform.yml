name: CMake Build (Windows)

on:
  push:
    branches: [ "main", "develop", "features" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build Project
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache CMake dependencies
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/build/_deps
        key: ${{ runner.os }}-cmake-deps-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}
        restore-keys: |
          ${{ runner.os }}-cmake-deps-

    - name: Configure CMake
      run: >
        cmake -B ${{ github.workspace }}/build 
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} 
        -A x64

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DirectX12-ImGui-Hook-${{ github.sha }}
        path: |
          .bin/**/DirectX12-Example.exe
          .bin/**/DirectX12-Example-ImGui.dll
        if-no-files-found: error
